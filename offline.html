<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartPaw - Sin conexión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0052CC 0%, #1765E3 100%);
      color: #fff; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 32px; text-align: center;
    }
    .card { max-width: 340px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 20px;
      background: #fff; color: #0052CC; font-size: 34px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.5; opacity: .9; margin-bottom: 28px; }
    button {
      background: #fff; color: #0052CC; border: 0; border-radius: 14px;
      padding: 14px 28px; font-size: 16px; font-weight: 700; width: 100%;
    }
    button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1>Sin conexión a internet</h1>
    <p>SmartPaw necesita internet para mostrar el mapa y los datos de tu mascota. Revisa tu conexión e inténtalo de nuevo.</p>
    <button onclick="window.location.href='https://jesusfh-dev.github.io/smartpaw-app/'">Reintentar</button>
  </div>
  <script>
    window.addEventListener('online', function () {
      window.location.href = 'https://jesusfh-dev.github.io/smartpaw-app/';
    });
  </script>
</body>
</html>
