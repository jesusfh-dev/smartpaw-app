name: Compilar APK

# El APK solo se recompila cuando cambia la parte nativa de la app.
# Los cambios en index.html se publican con "Publicar app web" y no requieren APK nuevo.
on:
  push:
    branches: [main]
    paths:
      - capacitor.config.json
      - package.json
      - offline.html
      - smartpaw-debug.keystore
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Comprobar SDK de Android (ya viene en el servidor)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar la app web
        run: |
          mkdir -p www
          cp index.html offline.html www/

      - name: Instalar Capacitor
        run: npm install

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Agregar permisos de ubicación (GPS)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' "$M"
          grep -q ACCESS_FINE_LOCATION "$M"
          cat "$M"

      - name: Usar siempre la misma firma y subir el número de versión
        run: |
          mkdir -p ~/.android
          cp smartpaw-debug.keystore ~/.android/debug.keystore
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$G"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -E "versionCode|versionName" "$G"

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmartPaw.apk

      - name: Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: SmartPaw-APK
          path: SmartPaw.apk

      - name: Publicar versión descargable (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: SmartPaw 1.${{ github.run_number }}
          make_latest: true
          files: SmartPaw.apk
          body: |
            Descarga directa para el celular:
            https://github.com/${{ github.repository }}/releases/latest/download/SmartPaw.apk
